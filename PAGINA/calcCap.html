<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Calculadora Capacitores</title>
        <link rel="stylesheet" type="text/css" href="calcCap.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="calcCap.js"></script>
</head>

<body>
    
    <div class="volver">
        <a href="main.html">
            <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="home" width="50" height="50">
        </a>
    </div>
    
    <div class="calculadora">
        
        <div class="titulo">
            <h1>Data-PB</h1>
        </div>
        
        <div class="subtitulo">
            <h2>Calculadora Capacitores</h2>
        </div>
        
        <input type="number" id="Capacitor" placeholder="Capacitancia (F)">
        
        <input type="number" id="Resistencia" placeholder="Resistencia (Ω)">
        
        <input type="number" id="Tiempo" placeholder="Tiempo (s)">
        
        <button onclick="calcular()">Calcular</button>
        
        <div id="resultado"></div>
        
    </div>
    
</body>
</html>
